observations:
  - Replacing visually rigid examples improved downward, side, smiling, and squinting expressions.
  - Checkpoint 600 at weight 0.7 gave the best balance of identity, expression flexibility, and apparent age.
  - The compact v0.2 negative prompt reduced startled frontal looks without weakening profiles or medium shots.
known_limitations:
  - Direct eye contact can still produce eyes that are more open than requested.
  - Explicit expression and gaze wording remains useful for sleepy or half-lidded results.
  - Body consistency was reviewed in medium shots, not as a full pose or anatomy benchmark.
