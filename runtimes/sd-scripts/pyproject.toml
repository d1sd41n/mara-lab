[project]
name = "mara-sd-scripts-runtime"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "accelerate==1.6.0",
  "bitsandbytes>=0.45,<0.50",
  "diffusers[torch]==0.32.1",
  "einops==0.7.0",
  "ftfy==6.3.1",
  "huggingface-hub==0.34.3",
  "imagesize==1.4.1",
  "numpy>=2,<3",
  "opencv-python==4.10.0.84",
  "rich==14.1.0",
  "safetensors==0.4.5",
  "sentencepiece==0.2.1",
  "tensorboard>=2.18,<3",
  "toml==0.10.2",
  "torch>=2.7,<3",
  "torchvision>=0.22,<1",
  "transformers==4.54.1",
  "voluptuous==0.15.2",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
